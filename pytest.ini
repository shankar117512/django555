[pytest]
DJANGO_SETTINGS_MODULE = config.settings.staging
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
testpaths = apps
# FIX 1: Removed --reuse-db from addopts. With django-tenants, --reuse-db can
# leave stale public/tenant schemas between runs which causes IntegrityErrors and
# schema-not-found errors. Use --create-db explicitly when you want a fresh DB,
# and rely on pytest-django's default (create fresh DB each run) otherwise.
# FIX 2: Added --no-header to reduce noise. Added -p no:cacheprovider (kept).
# FIX 3: Added --tb=short for readable tracebacks without overwhelming output.
addopts = -p no:cacheprovider --tb=short --no-header
