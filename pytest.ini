[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict

# This tells the Django test client which host to send in every request.
# django_tenants resolves the tenant/schema from this host header.
# A Domain row for "localhost" pointing to the public schema must exist —
# the conftest.py django_db_setup fixture creates it automatically.
SERVER_NAME = localhost
