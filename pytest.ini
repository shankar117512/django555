[pytest]
DJANGO_SETTINGS_MODULE = config.settings.staging
python_files = tests.py test_*.py *_tests.py
python_classes = Test*
python_functions = test_*
asyncio_mode = strict
testpaths = apps
# --migrations: ensure pytest-django always runs makemigrations/migrate before
#   any test code touches the DB.  Without this (or with --no-migrations) the
#   schema never gets created and every DB access raises
#   "relation <table> does not exist".
#
# --tb=short: readable tracebacks without overwhelming output.
# --no-header: reduce noise.
# -p no:cacheprovider: disable the .pytest_cache reuse that can surface stale
#   state across runs.
addopts = -p no:cacheprovider --tb=short --no-header --migrations
