# .github/workflows/rollback.yml
name: Manual Rollback (Dev)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for rollback"
        required: true
        type: string
      confirm:
        description: "Type CONFIRM to proceed"
        required: true
        type: string

env:
  RAILWAY_SERVICE: django555
  RAILWAY_ENVIRONMENT: dev
  HEALTH_URL: https://django555-dev.up.railway.app/health/

jobs:
  validate-rollback:
    name: Validate Rollback Request
    runs-on: ubuntu-latest
    steps:
      - name: Validate confirmation
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "CONFIRM" ]; then
            echo "Rollback not confirmed. Aborting."
            exit 1
          fi
          echo "Rollback confirmed for dev."
          echo "Reason: ${{ github.event.inputs.reason }}"

  rollback:
    name: Execute Rollback
    runs-on: ubuntu-latest
    needs: validate-rollback
    environment: dev
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_DEV }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Verify Railway CLI
        run: railway --version

      - name: Find previous successful deployment
        id: find_deployment
        run: |
          set -e
          echo "Fetching recent deployments for $RAILWAY_SERVICE ($RAILWAY_ENVIRONMENT)..."
          railway deployment list \
            --service "$RAILWAY_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --json --limit 10 > deployments.json

          cat deployments.json

          # Skip index 0 (current/latest) and pick the next SUCCESS deployment.
          ROLLBACK_ID=$(jq -r '[.[] | select(.status=="SUCCESS")][1].id // empty' deployments.json)

          if [ -z "$ROLLBACK_ID" ]; then
            echo "No earlier successful deployment found to roll back to."
            exit 1
          fi

          echo "Rolling back to deployment: $ROLLBACK_ID"
          echo "rollback_id=$ROLLBACK_ID" >> "$GITHUB_OUTPUT"

      - name: Execute rollback via Railway API
        run: |
          set -e
          ROLLBACK_ID="${{ steps.find_deployment.outputs.rollback_id }}"

          RESPONSE=$(curl -s -X POST https://backboard.railway.com/graphql/v2 \
            -H "Project-Access-Token: $RAILWAY_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @- <<EOF
          {
            "query": "mutation deploymentRollback(\$id: String!) { deploymentRollback(id: \$id) { id status } }",
            "variables": { "id": "$ROLLBACK_ID" }
          }
          EOF
          )

          echo "$RESPONSE"

          if echo "$RESPONSE" | jq -e '.errors' > /dev/null 2>&1; then
            echo "Rollback request failed:"
            echo "$RESPONSE" | jq '.errors'
            exit 1
          fi

          echo "Rollback triggered successfully for deployment $ROLLBACK_ID."

      - name: Verify rollback
        run: |
          echo "Waiting for rollback deployment to come up..."
          sleep 60
          curl -f "$HEALTH_URL" || exit 1
          echo "Rollback verified successfully against $HEALTH_URL."
