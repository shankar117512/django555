# .github/workflows/ci-production.yml
name: CI — Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: ""
  ENVIRONMENT: prod
  DJANGO_SETTINGS_MODULE: config.settings.production

jobs:
  lint:
    name: Full Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install black isort flake8 bandit safety mypy
      - run: black --check .
      - run: isort --check-only .
      - run: flake8 . --max-line-length=120 --exclude=venv,migrations
      - run: bandit -r apps/ -x apps/*/tests/ -ll
      - run: safety check -r requirements/production.txt

  test-production:
    name: Full Test Suite (Production Config)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_django_prod
          POSTGRES_USER: produser
          POSTGRES_PASSWORD: prodpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/production.txt pytest pytest-django pytest-cov
      - run: mkdir -p logs

      - name: Migrations check
        env:
          DATABASE_URL: postgres://produser:prodpassword@localhost:5432/test_django_prod?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_PROD }}
          DEBUG: "False"
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py migrate --noinput
          python manage.py check --deploy

      - name: Run full test suite (90% coverage required)
        env:
          DATABASE_URL: postgres://produser:prodpassword@localhost:5432/test_django_prod?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_PROD }}
          DEBUG: "False"
          ENVIRONMENT: production
          SECURE_SSL_REDIRECT: "False"
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-fail-under=90 \
            -v --tb=short

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  docker-build-production:
    name: Build Production Docker Image
    runs-on: ubuntu-latest
    needs: [test-production, security-scan]
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/production/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/django-app:production-${{ github.sha }}
            ghcr.io/${{ github.repository }}/django-app:latest
          build-args: |
            PYTHON_VERSION=3.12
            ENVIRONMENT=production
            DJANGO_SETTINGS_MODULE=config.settings.production

  deploy-production:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    needs: docker-build-production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://gregarious-purpose-production-98d4.up.railway.app
    steps:                    # ✅ Now correctly indented inside the job
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Capture pre-deploy state
        id: pre_deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway environment production
          PREV=$(railway deployment list --service ${{ secrets.RAILWAY_SERVICE_ID_PRODUCTION }} --json \
            | python3 -c "import sys,json; deps=json.load(sys.stdin); \
              active=[d for d in deps if d.get('status')=='SUCCESS']; \
              print(active[0]['id'] if active else 'none')" 2>/dev/null || echo "none")
          echo "previous_deployment=$PREV" >> "$GITHUB_OUTPUT"
          echo "Captured previous deployment: $PREV"

      - name: Deploy to Railway Production
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway environment production
          railway up --service gregarious-purpose --detach

      - name: Wait for deployment
        run: sleep 120

      - name: Run Post-Deploy Smoke Tests
        id: smoke_test
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          PRODUCTION_URL=$(railway variables get RAILWAY_STATIC_URL \
            --service ${{ secrets.RAILWAY_SERVICE_ID_PRODUCTION }} 2>/dev/null || echo "")
          if [ -n "$PRODUCTION_URL" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$PRODUCTION_URL/health/")
            echo "Health check returned: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ Smoke test failed with status $HTTP_STATUS. Initiating rollback..."
              exit 1
            fi
          else
            echo "⚠️ Could not resolve PRODUCTION_URL — skipping smoke test"
          fi
          echo "✅ Smoke tests passed"

      - name: Rollback on Failure
        if: failure() && steps.pre_deploy.outputs.previous_deployment != 'none'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          echo "🔄 Rolling back to: ${{ steps.pre_deploy.outputs.previous_deployment }}"
          railway deployment rollback ${{ steps.pre_deploy.outputs.previous_deployment }} \
            --service ${{ secrets.RAILWAY_SERVICE_ID_PRODUCTION }}
          echo "✅ Rollback completed"
