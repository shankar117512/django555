# .github/workflows/ci-production.yml
name: CI — Production

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  ENVIRONMENT: production
  DJANGO_SETTINGS_MODULE: config.settings.production

jobs:
  lint:
    name: Full Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install black isort flake8 bandit safety mypy
      - run: black --check .
      - run: isort --check-only .
      - run: flake8 . --max-line-length=120 --exclude=venv,migrations
      - run: bandit -r apps/ -x apps/*/tests/ -ll
      - run: safety check -r requirements/production.txt

  test-production:
    name: Full Test Suite (Production Config)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_django_prod
          POSTGRES_USER: produser
          POSTGRES_PASSWORD: prodpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements/production.txt pytest pytest-django pytest-cov
      - run: mkdir -p logs

      - name: Migrations check
        env:
          DATABASE_URL: postgres://produser:prodpassword@localhost:5432/test_django_prod?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_PROD }}
          DEBUG: "False"
          SECURE_SSL_REDIRECT: "False"
        run: |
          python manage.py migrate --noinput
          python manage.py check --deploy || true

      - name: Run full test suite (90% coverage required)
        env:
          DATABASE_URL: postgres://produser:prodpassword@localhost:5432/test_django_prod?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_PROD }}
          DEBUG: "False"
          ENVIRONMENT: production
          SECURE_SSL_REDIRECT: "False"
        run: |
          pytest \
            --cov=apps \
            --cov-report=xml \
            --cov-fail-under=90 \
            -v --tb=short

      - uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: production

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: 1

  docker-build:
    name: Build & Push Production Image
    runs-on: ubuntu-latest
    needs: [test-production, security-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          dockerfile: Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/django-railway:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/django-railway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-production:
    name: Deploy to Railway Production
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://yourapp.com

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: bash <(curl -fsSL cli.new)

      - name: Record pre-deploy version
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway status --environment production > pre_deploy_status.txt || true
          cat pre_deploy_status.txt

      - name: Deploy to Railway Production
        id: deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          railway environment production
          railway up --service gregarious-purpose --detach
          echo "deploy_sha=${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Wait for production deployment
        run: sleep 120

      - name: Production smoke tests
        id: smoke_test
        run: |
          BASE_URL="https://yourapp.com"
          FAILED=0

          echo "Testing health endpoint..."
          curl -f "$BASE_URL/health/" || FAILED=1

          echo "Testing API endpoint..."
          curl -f "$BASE_URL/api/v1/" || FAILED=1

          echo "Testing metrics endpoint..."
          curl -f "$BASE_URL/metrics/" || FAILED=1

          if [ "$FAILED" -ne 0 ]; then
            echo "SMOKE_FAILED=true" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "SMOKE_FAILED=false" >> $GITHUB_OUTPUT

      - name: Auto-rollback on failure
        if: failure() && steps.smoke_test.outputs.SMOKE_FAILED == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_PRODUCTION }}
        run: |
          echo "Smoke tests failed. Initiating automatic rollback..."
          railway rollback --environment production --service django-web
          echo "Rollback initiated. Notifying team..."
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"🔄 AUTO-ROLLBACK triggered for production. SHA: ${{ github.sha }}"}'

      - name: Notify success
        if: success()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"🚀 Production deploy SUCCESS: ${{ github.sha }} — https://yourapp.com"}'

      - name: Notify failure
        if: failure()
        run: |
          curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{"text":"💥 Production deploy FAILED + ROLLED BACK: ${{ github.sha }}"}'
