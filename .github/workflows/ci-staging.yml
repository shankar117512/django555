# .github/workflows/ci-staging.yml
name: CI — Staging

on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]

env:
  PYTHON_VERSION: "3.12"
  ENVIRONMENT: staging
  DJANGO_SETTINGS_MODULE: config.settings.staging

jobs:
  lint:
    name: Lint & Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install tools
        run: pip install black isort flake8 bandit safety
      - name: Black check
        run: black --check .
      - name: isort check
        run: isort --check-only .
      - name: flake8
        run: flake8 . --max-line-length=120 --exclude=venv,migrations
      - name: Bandit security scan
        run: bandit -r apps/ -x 'apps/*/tests/' -ll
      - name: Safety dependency check
        run: safety check -r requirements/staging.txt

  test-staging:
    name: Run Tests (Staging)
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: test_django_staging
          POSTGRES_USER: staginguser
          POSTGRES_PASSWORD: stagingpassword
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: pip install -r requirements/staging.txt

      - name: Create logs dir
        run: mkdir -p logs

      - name: Run migrations
        env:
          DATABASE_URL: postgres://staginguser:stagingpassword@localhost:5432/test_django_staging?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_STAGING }}
          DEBUG: "False"
        run: python manage.py migrate --noinput

      - name: Clear pycache
        run: find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null || true

      - name: Run full test suite
        env:
          DATABASE_URL: postgres://staginguser:stagingpassword@localhost:5432/test_django_staging?sslmode=disable
          REDIS_URL: redis://localhost:6379/0
          DJANGO_SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY_STAGING }}
          DEBUG: "False"
          ENVIRONMENT: staging
          SECURE_SSL_REDIRECT: "False"
        run: |
          coverage run -m pytest --tb=short -v --junit-xml=test-results.xml
          coverage report --fail-under=80
          coverage xml

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: staging

  docker-build:
    name: Build Staging Docker Image
    runs-on: ubuntu-latest
    needs: test-staging
    steps:
      - uses: actions/checkout@v4
      - name: Build staging image
        run: |
          docker build \
            -f docker/staging/Dockerfile \
            -t django-app:staging-${{ github.sha }} \
            .

  deploy-staging:
    name: Deploy to Railway Staging
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment:
      name: staging
      url: https://charming-passion-staging.up.railway.app

    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: |
          curl -fsSL https://install.railway.app | sh
          echo "/root/.railway/bin" >> "$GITHUB_PATH"

      - name: Deploy to Railway Staging
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
        run: |
          railway environment staging
          railway up --service charming-passion --detach

      - name: Wait for deployment
        run: sleep 90

      - name: Run Post-Deploy Smoke Tests
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          STAGING_URL=$(railway variables get RAILWAY_STATIC_URL --service ${{ secrets.RAILWAY_SERVICE_ID_STAGING }} 2>/dev/null || echo "")
          if [ -n "$STAGING_URL" ]; then
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$STAGING_URL/health/")
            echo "Health check returned: $HTTP_STATUS"
            if [ "$HTTP_STATUS" != "200" ]; then
              echo "❌ Smoke test failed. Initiating rollback..."
              exit 1
            fi
          fi
          echo "✅ Smoke tests passed"

      - name: Rollback on Failure
        if: failure() && steps.pre_deploy.outputs.previous_deployment != 'none'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          echo "🔄 Rolling back to: ${{ steps.pre_deploy.outputs.previous_deployment }}"
          railway deployments rollback ${{ steps.pre_deploy.outputs.previous_deployment }} --service ${{ secrets.RAILWAY_SERVICE_ID_STAGING }}
          echo "✅ Rollback completed"
