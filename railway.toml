# railway.toml
[build]
builder = "dockerfile"
dockerfilePath = "docker/production/Dockerfile"

[deploy]
startCommand = "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120"
healthcheckPath = "/health/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "gregarious-purpose"
source = "."

[[services]]
name = "celery-worker"
startCommand = "celery -A config worker -l WARNING --concurrency=4"
