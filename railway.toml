# ✅ FIXED railway.toml (for the web service only)
[build]
builder = "dockerfile"
dockerfilePath = "docker/dev/Dockerfile"

[deploy]
startCommand = "sh -c 'gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 4 --timeout 120'"
healthcheckPath = "/health/"
healthcheckTimeout = 60
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
