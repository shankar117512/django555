# railway.toml
[build]
builder = "dockerfile"
dockerfilePath = "docker/staging/Dockerfile"
watchPatterns = ["**/*.py", "requirements*.txt", "Dockerfile"]

[deploy]
[start]
startcommand = "gunicorn config.wsgi:application --bind 0.0.0.0:${PORT:-8000} --workers 2 --timeout 120 --access-logfile - --error-logfile -",
healthcheckPath = "/health/"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[[services]]
name = "charming-passion"
source = "."

[[services]]
name = "celery-worker"
startCommand = "celery -A config worker -l WARNING --concurrency=4"
