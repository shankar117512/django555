# docker-compose.production.yml
version: "3.9"

services:
  app-production:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_app_production
    restart: always
    env_file:
      - envs/.env.production
    ports:
      - "8002:8000"
    volumes:
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 2
      restart_policy:
        condition: on-failure
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback

  nginx:
    image: nginx:alpine
    container_name: django_nginx_production
    restart: always
    volumes:
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/var/www/staticfiles:ro
      - ./media:/var/www/media:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - app-production

  celery-production:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: django_celery_production
    command: celery -A config worker -l WARNING --concurrency=4
    restart: always
    env_file:
      - envs/.env.production
    depends_on:
      - app-production
