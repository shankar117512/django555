{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Login | Gregarious</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {

            min-height: 100vh;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #ffffff;
        }


        /* =====================================================
           MAIN PAGE
        ===================================================== */

        .login-page {

            width: 100%;

            min-height: 100vh;

            display: flex;

            overflow: hidden;
        }


        /* =====================================================
           LEFT SIDE
        ===================================================== */

        .illustration-panel {

            width: 50%;

            min-height: 100vh;

            background: #f7f8fb;

            overflow: hidden;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .illustration-panel img {

            width: 100%;

            height: 100%;

            display: block;

            object-fit: cover;

            object-position: center;
        }


        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .form-panel {

            width: 50%;

            min-height: 100vh;

            background: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-box {

            width: 320px;

            max-width: 100%;

            padding: 22px;

            background: #ffffff;

            border: 1px solid #eeeeee;

            border-radius: 6px;

            box-shadow:
                0 2px 8px
                rgba(0, 0, 0, 0.08);
        }


        .login-box h1 {

            margin: 0 0 22px;

            color: #171717;

            font-size: 24px;

            font-weight: 700;
        }


        /* =====================================================
           FORM
        ===================================================== */

        .field {

            margin-bottom: 16px;
        }


        .field label {

            display: block;

            margin-bottom: 6px;

            color: #555555;

            font-size: 12px;
        }


        .field input {

            width: 100%;

            height: 38px;

            padding: 8px 10px;

            border: 1px solid #d9dee5;

            border-radius: 5px;

            background: #f5f7fa;

            color: #222222;

            font-size: 13px;

            outline: none;
        }


        .field input:focus {

            border-color: #2f6fed;

            background: #ffffff;

            box-shadow:
                0 0 0 2px
                rgba(47, 111, 237, 0.10);
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-btn {

            width: 100%;

            height: 38px;

            margin-top: 2px;

            border: none;

            border-radius: 5px;

            background: #1976ed;

            color: #ffffff;

            font-size: 13px;

            font-weight: 500;

            cursor: pointer;
        }


        .login-btn:hover {

            background: #1264d2;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .login-error {

            margin-bottom: 16px;

            padding: 9px 11px;

            border: 1px solid #fecaca;

            border-radius: 5px;

            background: #fef2f2;

            color: #991b1b;

            font-size: 12px;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 760px) {

            .login-page {
                display: block;
            }

            .illustration-panel {
                display: none;
            }

            .form-panel {

                width: 100%;

                min-height: 100vh;

                padding: 20px;
            }

            .login-box {
                width: 100%;
                max-width: 360px;
            }

        }

    </style>

</head>


<body>


<div class="login-page">


    <!-- =====================================================
         LEFT ILLUSTRATION
    ====================================================== -->

    <div class="illustration-panel">

        <img
            src="{% static 'accounts/login_illustration.png' %}"
            alt="Gregarious business analytics"
        >

    </div>


    <!-- =====================================================
         RIGHT LOGIN
    ====================================================== -->

    <div class="form-panel">

        <div class="login-box">


            <h1>
                Login
            </h1>


            {% if error_message %}

                <div class="login-error">
                    {{ error_message }}
                </div>

            {% endif %}


            <form
                method="post"
                action="{% url 'accounts:login' %}"
            >

                {% csrf_token %}


                <div class="field">

                    <label for="id_username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="id_username"
                        name="username"
                        value="{{ username }}"
                        autocomplete="username"
                        autofocus
                        required
                    >

                </div>


                <div class="field">

                    <label for="id_password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="id_password"
                        name="password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <input
                    type="hidden"
                    name="next"
                    value="{{ next }}"
                >


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login
                </button>


            </form>


        </div>

    </div>


</div>


</body>

</html>
