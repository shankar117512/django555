<!-- templates/accounts/login.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | Growth OS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex;
            min-height: 100vh;
        }
        .illustration-panel {
            flex: 1.3;
            background: linear-gradient(135deg, #eef3ff 0%, #f7f2e9 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .illustration-panel .stat-card {
            position: absolute;
            background: #fff;
            border-radius: 10px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.08);
            padding: 10px 16px;
            font-weight: 600;
            font-size: 14px;
            color: #333;
        }
        .stat-card.c1 { top: 18%; left: 10%; color: #2e7d32; }
        .stat-card.c2 { top: 30%; right: 12%; color: #1565c0; }
        .stat-card.c3 { bottom: 22%; left: 14%; color: #ef6c00; }
        .illustration-panel .center-icon {
            font-size: 90px;
        }
        .form-panel {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #ffffff;
        }
        .login-box {
            width: 320px;
        }
        .login-box h1 {
            font-size: 26px;
            margin-bottom: 24px;
            color: #1a1a1a;
        }
        .field { margin-bottom: 18px; }
        .field label {
            display: block;
            font-size: 13px;
            color: #555;
            margin-bottom: 6px;
        }
        .field input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dfe3e8;
            border-radius: 6px;
            background: #f5f7fa;
            font-size: 14px;
        }
        .field input:focus {
            outline: none;
            border-color: #2f6fed;
            background: #fff;
        }
        button.login-btn {
            width: 100%;
            padding: 11px;
            background: #2f6fed;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button.login-btn:hover { background: #2559c9; }
        .errorlist {
            list-style: none;
            padding: 0;
            margin: 0 0 14px 0;
            color: #c0392b;
            font-size: 13px;
        }
        @media (max-width: 760px) {
            .illustration-panel { display: none; }
        }
    </style>
</head>
<body>
    <div class="illustration-panel">
        <div class="stat-card c1">📈 Leads: 150</div>
        <div class="stat-card c2">🎯 ROI: 350%</div>
        <div class="stat-card c3">💰 Spend: 15,00</div>
        <div class="center-icon">🚀</div>
    </div>

    <div class="form-panel">
        <div class="login-box">
            <h1>Login</h1>
            <form method="post">
                {% csrf_token %}

                {% if form.non_field_errors %}
                    <ul class="errorlist">
                        {% for error in form.non_field_errors %}
                            <li>{{ error }}</li>
                        {% endfor %}
                    </ul>
                {% endif %}

                <div class="field">
                    <label for="id_username">Username</label>
                    <input type="text" name="username" id="id_username" autofocus required>
                </div>

                <div class="field">
                    <label for="id_password">Password</label>
                    <input type="password" name="password" id="id_password" required>
                </div>

                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="login-btn">Login</button>
            </form>
        </div>
    </div>
</body>
</html>
