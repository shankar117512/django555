<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Sent | E-Commerce</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial;

            background:
                linear-gradient(
                    135deg,
                    #082b9f,
                    #2384ff
                );
        }

        .card {
            width: 450px;
            max-width: 90%;

            padding: 45px;

            background: white;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        h1 {
            color: #17235c;
        }

        p {
            color: #73809e;
            line-height: 1.7;
        }

        a {
            color: #2166f3;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>📧 Check Your Email</h1>

    <p>
        If an account exists with that email address,
        password reset instructions have been sent.
    </p>

    <p>
        Please check your inbox and spam folder.
    </p>

    <a href="{% url 'accounts:ecommerce_login' %}">
        ← Back to Login
    </a>

</div>

</body>
</html>
