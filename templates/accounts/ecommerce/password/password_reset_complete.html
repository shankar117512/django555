<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Password Changed | E-Commerce</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial;

            background:
                linear-gradient(
                    135deg,
                    #082b9f,
                    #2384ff
                );
        }

        .card {
            width: 430px;
            max-width: 90%;

            padding: 45px;

            background: white;

            border-radius: 20px;

            text-align: center;

            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        h1 {
            color: #17235c;
        }

        p {
            color: #73809e;
            line-height: 1.7;
        }

        a {
            display: inline-block;

            margin-top: 15px;

            color: white;

            background: #2166f3;

            padding: 13px 25px;

            border-radius: 10px;

            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>✅ Password Changed</h1>

    <p>
        Your password has been successfully changed.
    </p>

    <a href="{% url 'accounts:ecommerce_login' %}">
        Login Now
    </a>

</div>

</body>
</html>
