<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password | E-Commerce</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #082b9f,
                    #2384ff
                );
        }

        .card {
            width: 430px;
            max-width: 90%;

            background: white;

            padding: 40px;

            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        h1 {
            margin: 0 0 10px;

            color: #17235c;
        }

        p {
            color: #73809e;

            line-height: 1.6;
        }

        label {
            display: block;

            font-weight: 700;

            margin: 25px 0 8px;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d7deeb;

            border-radius: 10px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            margin-top: 20px;

            padding: 14px;

            border: 0;

            border-radius: 10px;

            background: #2166f3;

            color: white;

            font-weight: 700;

            cursor: pointer;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #2166f3;

            text-decoration: none;
        }

        .errorlist {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Forgot Password?</h1>

    <p>
        Enter your email address and we will send
        you instructions to reset your password.
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.email.errors }}

        <label for="{{ form.email.id_for_label }}">
            Email Address
        </label>

        {{ form.email }}

        <button type="submit">
            Send Reset Link
        </button>

    </form>

    <a
        class="back"
        href="{% url 'accounts:ecommerce_login' %}"
    >
        ← Back to Login
    </a>

</div>

</body>
</html>
