<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Set New Password | E-Commerce</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial;

            background:
                linear-gradient(
                    135deg,
                    #082b9f,
                    #2384ff
                );
        }

        .card {
            width: 430px;
            max-width: 90%;

            padding: 40px;

            background: white;

            border-radius: 20px;

            box-shadow:
                0 25px 70px rgba(0,0,0,.25);
        }

        h1 {
            color: #17235c;
        }

        label {
            display: block;

            margin-top: 20px;
            margin-bottom: 8px;

            font-weight: 700;
        }

        input {
            width: 100%;

            padding: 14px;

            border: 1px solid #d7deeb;

            border-radius: 10px;

            box-sizing: border-box;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: 0;

            border-radius: 10px;

            background: #2166f3;

            color: white;

            font-weight: 700;
        }

        .errorlist {
            color: #c62828;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Set New Password</h1>

    {% if validlink %}

        <form method="post">

            {% csrf_token %}

            {{ form.non_field_errors }}

            {{ form.new_password1.errors }}

            <label>
                New Password
            </label>

            {{ form.new_password1 }}

            {{ form.new_password2.errors }}

            <label>
                Confirm Password
            </label>

            {{ form.new_password2 }}

            <button type="submit">
                Change Password
            </button>

        </form>

    {% else %}

        <p>
            This password reset link is invalid or has
            already been used.
        </p>

    {% endif %}

</div>

</body>
</html>
