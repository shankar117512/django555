{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        School Management System - Login
    </title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #ffffff;
        }

        .login-page {
            min-height: 100vh;

            display: flex;
        }

        .illustration-panel {
            width: 50%;

            min-height: 100vh;

            background:
                linear-gradient(
                    135deg,
                    #e8f5ff,
                    #dceeff
                );

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            padding: 35px;
        }

        .illustration-content {
            width: 100%;
            max-width: 570px;
        }

        .illustration-title {
            color: #064da5;

            font-size: 30px;

            line-height: 1.05;

            font-weight: 700;

            margin-bottom: 10px;
        }

        .illustration-text {
            color: #536779;

            font-size: 12px;

            line-height: 1.5;

            margin-bottom: 20px;
        }

        .school-art {
            width: 100%;

            max-width: 560px;

            display: block;
        }

        .form-panel {
            width: 50%;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            background: #ffffff;

            padding: 30px;
        }

        .login-card {
            width: 100%;

            max-width: 330px;

            background: #ffffff;

            border: 1px solid #e2e2e2;

            border-radius: 5px;

            padding: 28px 20px;

            box-shadow:
                0 2px 12px
                rgba(0, 0, 0, 0.10);
        }

        .title {
            text-align: center;

            margin-bottom: 25px;
        }

        .title h1 {
            margin: 0;

            color: #005bea;

            font-size: 18px;

            line-height: 1.35;

            font-weight: 600;
        }

        .title p {
            margin: 7px 0 0;

            color: #777777;

            font-size: 10px;
        }

        .error {
            margin-bottom: 15px;

            padding: 9px 10px;

            border: 1px solid #f1b0b7;

            border-radius: 3px;

            background: #fff1f2;

            color: #a94442;

            font-size: 11px;
        }

        .field {
            margin-bottom: 16px;
        }

        .field label {
            display: block;

            margin-bottom: 6px;

            color: #333333;

            font-size: 11px;
        }

        .field input {
            width: 100%;

            height: 38px;

            padding: 8px 10px;

            border:
                1px solid #d1d5db;

            border-radius: 3px;

            outline: none;

            font-size: 11px;
        }

        .field input:focus {
            border-color: #0878d1;

            box-shadow:
                0 0 0 2px
                rgba(8, 120, 209, 0.10);
        }

        .login-button {
            width: 100%;

            height: 38px;

            border: none;

            border-radius: 3px;

            background: #006fc9;

            color: #ffffff;

            font-size: 11px;

            cursor: pointer;
        }

        .login-button:hover {
            background: #005da8;
        }

        .footer-text {
            margin-top: 20px;

            text-align: center;

            color: #777777;

            font-size: 9px;
        }

        @media (max-width: 760px) {

            .login-page {
                display: block;
            }

            .illustration-panel {
                width: 100%;

                min-height: 280px;

                padding: 25px;
            }

            .illustration-title {
                font-size: 25px;
            }

            .form-panel {
                width: 100%;

                min-height: calc(100vh - 280px);

                padding: 20px;
            }

        }

    </style>

</head>

<body>

<div class="login-page">


    <!-- LEFT -->

    <section class="illustration-panel">

        <div class="illustration-content">

            <div class="illustration-title">
                School<br>
                Management<br>
                System
            </div>

            <div class="illustration-text">
                Easily manage students, teachers,<br>
                classes, and academic activities.
            </div>

            <!-- CSS based school illustration -->

            <svg
                class="school-art"
                viewBox="0 0 600 330"
                xmlns="http://www.w3.org/2000/svg"
            >

                <!-- background clouds -->

                <circle
                    cx="100"
                    cy="85"
                    r="22"
                    fill="#ffffff"
                    opacity="0.9"
                />

                <circle
                    cx="125"
                    cy="78"
                    r="30"
                    fill="#ffffff"
                    opacity="0.9"
                />

                <circle
                    cx="150"
                    cy="88"
                    r="22"
                    fill="#ffffff"
                    opacity="0.9"
                />


                <!-- school roof -->

                <polygon
                    points="150,145 430,145 470,190 115,190"
                    fill="#075eb8"
                />

                <rect
                    x="155"
                    y="180"
                    width="285"
                    height="120"
                    rx="3"
                    fill="#ffffff"
                    stroke="#b9d8f2"
                    stroke-width="3"
                />


                <!-- windows -->

                <rect
                    x="185"
                    y="205"
                    width="35"
                    height="30"
                    fill="#91c9f3"
                />

                <rect
                    x="250"
                    y="205"
                    width="35"
                    height="30"
                    fill="#91c9f3"
                />

                <rect
                    x="315"
                    y="205"
                    width="35"
                    height="30"
                    fill="#91c9f3"
                />

                <rect
                    x="380"
                    y="205"
                    width="35"
                    height="30"
                    fill="#91c9f3"
                />


                <!-- door -->

                <rect
                    x="270"
                    y="250"
                    width="55"
                    height="50"
                    fill="#3b8bd5"
                />

                <circle
                    cx="312"
                    cy="275"
                    r="3"
                    fill="#ffffff"
                />


                <!-- school sign -->

                <rect
                    x="235"
                    y="160"
                    width="125"
                    height="40"
                    rx="4"
                    fill="#0878d1"
                />

                <text
                    x="297"
                    y="185"
                    text-anchor="middle"
                    fill="#ffffff"
                    font-size="18"
                    font-family="Arial"
                    font-weight="bold"
                >
                    SCHOOL
                </text>


                <!-- books -->

                <rect
                    x="55"
                    y="280"
                    width="100"
                    height="12"
                    rx="4"
                    fill="#2d80c9"
                />

                <rect
                    x="45"
                    y="293"
                    width="110"
                    height="12"
                    rx="4"
                    fill="#6caee8"
                />

                <rect
                    x="60"
                    y="306"
                    width="95"
                    height="12"
                    rx="4"
                    fill="#1d6fb8"
                />


                <!-- plant -->

                <rect
                    x="105"
                    y="270"
                    width="20"
                    height="40"
                    fill="#b97943"
                />

                <circle
                    cx="115"
                    cy="260"
                    r="25"
                    fill="#69b87c"
                />

                <circle
                    cx="95"
                    cy="270"
                    r="17"
                    fill="#77c68b"
                />

                <circle
                    cx="135"
                    cy="270"
                    r="17"
                    fill="#77c68b"
                />


                <!-- laptop -->

                <rect
                    x="405"
                    y="245"
                    width="105"
                    height="65"
                    rx="4"
                    fill="#ffffff"
                    stroke="#1674c5"
                    stroke-width="5"
                />

                <rect
                    x="418"
                    y="255"
                    width="80"
                    height="42"
                    fill="#d8ecff"
                />

                <polygon
                    points="390,312 525,312 550,325 370,325"
                    fill="#146eb7"
                />

            </svg>

        </div>

    </section>


    <!-- RIGHT -->

    <section class="form-panel">

        <div class="login-card">

            <div class="title">

                <h1>
                    School Management<br>
                    System
                </h1>

                <p>
                    School Administration Login
                </p>

            </div>


            {% if error_message %}

                <div class="error">
                    {{ error_message }}
                </div>

            {% endif %}


            <form
                method="post"
                action="{% url 'accounts:school_login' %}"
            >

                {% csrf_token %}


                <div class="field">

                    <label
                        for="school_username"
                    >
                        Username
                    </label>

                    <input
                        type="text"
                        id="school_username"
                        name="username"
                        value="{{ username }}"
                        placeholder="Enter username"
                        autocomplete="username"
                        autofocus
                        required
                    >

                </div>


                <div class="field">

                    <label
                        for="school_password"
                    >
                        Password
                    </label>

                    <input
                        type="password"
                        id="school_password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button"
                >
                    Login
                </button>

            </form>


            <div class="footer-text">
                School Management System
            </div>

        </div>

    </section>

</div>

</body>

</html>
