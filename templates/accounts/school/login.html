{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>School Management System - Login</title>


    <style>

        * {
            box-sizing: border-box;
        }


        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
        }


        body {

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Arial,
                sans-serif;

            background: #ffffff;

            overflow: hidden;
        }


        /* =====================================================
           MAIN LOGIN PAGE
        ===================================================== */

        .school-login-page {

            width: 100%;
            min-height: 100vh;

            display: flex;

            background: #ffffff;
        }


        /* =====================================================
           LEFT SIDE
        ===================================================== */

        .school-left {

            width: 50%;
            min-height: 100vh;

            position: relative;

            overflow: hidden;

            background:
                linear-gradient(
                    135deg,
                    #edf7ff 0%,
                    #e2f1ff 100%
                );

            padding:
                55px 8% 35px;
        }


        .school-left-content {

            position: relative;

            z-index: 5;

            width: 100%;
            height: 100%;

            display: flex;

            flex-direction: column;

            justify-content: flex-start;
        }


        /* =====================================================
           LEFT HEADING
        ===================================================== */

        .school-heading {

            margin: 0;

            max-width: 430px;

            color: #0756a8;

            font-size: clamp(
                34px,
                4vw,
                56px
            );

            line-height: 1.08;

            font-weight: 700;

            letter-spacing: -1.5px;
        }


        .school-description {

            margin:

                18px 0 0;

            max-width: 420px;

            color: #48627d;

            font-size: 16px;

            line-height: 1.55;
        }


        /* =====================================================
           DECORATIVE BACKGROUND
        ===================================================== */

        .cloud {

            position: absolute;

            border-radius: 50%;

            background: rgba(
                255,
                255,
                255,
                0.55
            );

            z-index: 1;
        }


        .cloud-one {

            width: 120px;
            height: 35px;

            left: 4%;
            top: 38%;

            border-radius: 50px;
        }


        .cloud-two {

            width: 95px;
            height: 28px;

            right: 12%;
            top: 35%;

            border-radius: 50px;
        }


        .cloud-three {

            width: 150px;
            height: 40px;

            right: 8%;
            bottom: 20%;

            border-radius: 50px;

            opacity: 0.45;
        }


        .cloud::before,
        .cloud::after {

            content: "";

            position: absolute;

            border-radius: 50%;

            background: inherit;
        }


        .cloud::before {

            width: 42px;
            height: 42px;

            left: 20px;
            bottom: 3px;
        }


        .cloud::after {

            width: 55px;
            height: 55px;

            right: 20px;
            bottom: 0;
        }


        /* =====================================================
           ILLUSTRATION AREA
        ===================================================== */

        .illustration {

            position: absolute;

            left: 3%;

            right: 3%;

            bottom: 20px;

            height: 58%;

            z-index: 3;
        }


        .illustration svg {

            width: 100%;
            height: 100%;

            display: block;
        }


        /* =====================================================
           RIGHT SIDE
        ===================================================== */

        .school-right {

            width: 50%;
            min-height: 100vh;

            background: #ffffff;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px;
        }


        /* =====================================================
           LOGIN CARD
        ===================================================== */

        .login-card {

            width: 100%;

            max-width: 430px;

            padding:
                34px 40px 30px;

            background: #ffffff;

            border:
                1px solid #eeeeee;

            border-radius: 7px;

            box-shadow:
                0 4px 18px
                rgba(
                    0,
                    0,
                    0,
                    0.09
                );
        }


        /* =====================================================
           LOGIN TITLE
        ===================================================== */

        .login-title {

            margin: 0;

            text-align: center;

            color: #0567d8;

            font-size: 27px;

            line-height: 1.35;

            font-weight: 600;
        }


        .login-subtitle {

            margin:

                9px 0 30px;

            text-align: center;

            color: #707070;

            font-size: 13px;
        }


        /* =====================================================
           ERROR
        ===================================================== */

        .login-error {

            margin-bottom: 18px;

            padding:
                10px 12px;

            border:
                1px solid #f2b8b5;

            border-radius: 4px;

            background: #fff4f3;

            color: #a94442;

            font-size: 13px;

            line-height: 1.4;
        }


        /* =====================================================
           FORM FIELD
        ===================================================== */

        .form-field {

            margin-bottom: 19px;
        }


        .form-field label {

            display: block;

            margin-bottom: 8px;

            color: #303030;

            font-size: 13px;

            font-weight: 500;
        }


        .input-wrapper {

            position: relative;

            width: 100%;
        }


        .input-icon {

            position: absolute;

            left: 13px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 18px;
            height: 18px;

            color: #707b87;

            pointer-events: none;
        }


        .input-wrapper input {

            width: 100%;

            height: 44px;

            padding:
                8px 42px;

            border:
                1px solid #cfd4da;

            border-radius: 4px;

            outline: none;

            background: #ffffff;

            color: #303030;

            font-size: 13px;

            transition:
                border-color .2s,
                box-shadow .2s;
        }


        .input-wrapper input::placeholder {

            color: #8a9097;
        }


        .input-wrapper input:focus {

            border-color: #0878d1;

            box-shadow:
                0 0 0 2px
                rgba(
                    8,
                    120,
                    209,
                    0.10
                );
        }


        /* =====================================================
           PASSWORD EYE
        ===================================================== */

        .password-toggle {

            position: absolute;

            right: 12px;

            top: 50%;

            transform:
                translateY(-50%);

            width: 20px;
            height: 20px;

            border: none;

            padding: 0;

            background: transparent;

            color: #65717d;

            cursor: pointer;
        }


        .password-toggle svg {

            width: 17px;
            height: 17px;
        }


        /* =====================================================
           LOGIN BUTTON
        ===================================================== */

        .login-button {

            width: 100%;

            height: 44px;

            margin-top: 4px;

            border: none;

            border-radius: 4px;

            background:
                linear-gradient(
                    90deg,
                    #0875c9,
                    #0568bb
                );

            color: #ffffff;

            font-size: 14px;

            font-weight: 500;

            cursor: pointer;

            transition:
                background .2s,
                transform .1s;
        }


        .login-button:hover {

            background:
                linear-gradient(
                    90deg,
                    #0768b4,
                    #055da8
                );
        }


        .login-button:active {

            transform:
                translateY(1px);
        }


        /* =====================================================
           FOOTER
        ===================================================== */

        .login-footer {

            margin-top: 28px;

            text-align: center;

            color: #737b84;

            font-size: 11px;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 900px) {

            body {

                overflow: auto;
            }


            .school-login-page {

                min-height: 100vh;

                display: block;
            }


            .school-left {

                width: 100%;

                min-height: 430px;

                padding:
                    40px 35px 0;
            }


            .school-heading {

                font-size: 38px;

                max-width: 450px;
            }


            .school-description {

                font-size: 14px;

                max-width: 400px;
            }


            .illustration {

                height: 55%;

                bottom: 0;
            }


            .school-right {

                width: 100%;

                min-height: 520px;

                padding:
                    35px 20px;
            }


            .login-card {

                max-width: 430px;
            }

        }


        @media (max-width: 500px) {

            .school-left {

                min-height: 360px;

                padding:
                    30px 25px 0;
            }


            .school-heading {

                font-size: 31px;

                letter-spacing: -0.8px;
            }


            .school-description {

                font-size: 12px;

                margin-top: 12px;
            }


            .illustration {

                left: 0;
                right: 0;

                height: 53%;
            }


            .school-right {

                padding:
                    25px 15px;
            }


            .login-card {

                padding:
                    28px 24px;
            }


            .login-title {

                font-size: 23px;
            }

        }

    </style>

</head>

                            name="password"
                            placeholder="Enter password"
                            autocomplete="current-password"
                            required
                        >


                        <!-- Show password -->

                        <button
                            type="button"
                            class="password-toggle"
                            id="passwordToggle"
                            aria-label="Show password"
                        >

                            <svg
                                id="eyeIcon"
                                viewBox="0 0 24 24"
                                fill="none"
                                xmlns="http://www.w3.org/2000/svg"
                            >

                                <path
                                    d="
                                        M2.5 12
                                        C5 7.8 8.3 5.5
                                        12 5.5
                                        C15.7 5.5 19 7.8
                                        21.5 12
                                        C19 16.2 15.7 18.5
                                        12 18.5
                                        C8.3 18.5 5 16.2 2.5 12Z
                                    "
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                />

                                <circle
                                    cx="12"
                                    cy="12"
                                    r="3"
                                    stroke="currentColor"
                                    stroke-width="1.6"
                                />

                            </svg>

                        </button>


                    </div>

                </div>



                <!-- Login button -->

                <button
                    type="submit"
                    class="login-button"
                >

                    Login

                </button>


            </form>


            <div class="login-footer">

                School Management System

            </div>


        </div>


    </section>


</div>



<script>

    /*
     * Show / Hide Password
     */

    const passwordInput =
        document.getElementById(
            "school_password"
        );

    const passwordToggle =
        document.getElementById(
            "passwordToggle"
        );


    passwordToggle.addEventListener(
        "click",
        function () {

            if (
                passwordInput.type === "password"
            ) {

                passwordInput.type =
                    "text";

            } else {

                passwordInput.type =
                    "password";
            }

        }
    );

</script>


</body>

</html>
