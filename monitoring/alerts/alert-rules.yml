# monitoring/alerts/alert-rules.yml
groups:
  - name: django_alerts
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          rate(django_http_requests_total{status_code=~"5.."}[5m]) /
          rate(django_http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate on {{ $labels.environment }}"
          description: "Error rate is {{ $value | humanizePercentage }} over 5m"

      # High response latency
      - alert: HighResponseLatency
        expr: |
          histogram_quantile(0.95,
            rate(django_http_request_duration_seconds_bucket[5m])
          ) > 2.0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High p95 latency: {{ $value }}s"

      # Database connection saturation
      - alert: DBConnectionSaturation
        expr: pg_stat_activity_count > 90
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "DB connections near limit: {{ $value }}"

      # Redis down
      - alert: RedisDown
        expr: redis_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is DOWN"

      # Disk space low
      - alert: DiskSpaceLow
        expr: (1 - node_filesystem_avail_bytes / node_filesystem_size_bytes) > 0.85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage at {{ $value | humanizePercentage }}"

      # Memory usage high
      - alert: HighMemoryUsage
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.90
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Memory at {{ $value | humanizePercentage }}"

      # Service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.job }} is DOWN"
